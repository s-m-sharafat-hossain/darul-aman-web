<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Darul Aman Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Anek+Bangla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal-body">

<div class="auth-shell">
  <div class="auth-card">
    <a href="login.html" class="auth-back"><i class="fa-solid fa-arrow-left"></i> Back to login</a>

    <div class="auth-logo">
      <img src="../Logo_icon/L-2.svg" alt="Darul Aman Academy">
      <div class="brand">
        <h4>DARUL AMAN ACADEMY</h4>
        <span>Reset your password</span>
      </div>
    </div>

    <div class="auth-error" id="msgBox"></div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label">User ID, Email or Phone</label>
        <input type="text" class="form-control" id="identifier" placeholder="Enter your account identifier" required>
      </div>
      <button type="submit" class="btn btn-portal-primary w-100" id="submitBtn">Send Reset Link</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('msgBox');
  const btn = document.getElementById('submitBtn');
  box.classList.remove('show');
  btn.disabled = true;
  try {
    const data = await window.DAA_API.post('/auth/forgot-password', { identifier: document.getElementById('identifier').value.trim() });
    box.style.background = 'var(--ok-soft)';
    box.style.color = 'var(--ok)';
    box.textContent = data.message + (data.devResetToken ? ' (Dev token: ' + data.devResetToken + ')' : '');
    box.classList.add('show');
  } catch (err) {
    box.style.background = 'var(--danger-soft)';
    box.style.color = 'var(--danger)';
    box.textContent = err.message;
    box.classList.add('show');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
