<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Darul Aman Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Anek+Bangla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal-body">

<div class="auth-shell">
  <div class="auth-card">
    <a href="login.html" class="auth-back"><i class="fa-solid fa-arrow-left"></i> Back to login</a>

    <div class="auth-logo">
      <img src="../Logo_icon/L-2.svg" alt="Darul Aman Academy">
      <div class="brand">
        <h4>DARUL AMAN ACADEMY</h4>
        <span>Choose a new password</span>
      </div>
    </div>

    <div class="auth-error" id="msgBox"></div>

    <form id="resetForm">
      <div class="mb-3">
        <label class="form-label" for="newPassword">New Password</label>
        <input type="password" class="form-control" id="newPassword" placeholder="At least 8 characters, with upper/lowercase and a number" required minlength="8" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-portal-primary w-100" id="submitBtn">Reset Password</button>
    </form>

    <div id="successPanel" class="d-none text-center">
      <p class="mb-3">Your password has been reset. You can now log in with your new password.</p>
      <a href="login.html" class="btn btn-portal-primary w-100">Go to Login</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  const form = document.getElementById('resetForm');
  const box = document.getElementById('msgBox');
  const btn = document.getElementById('submitBtn');

  function showMessage(text, isError) {
    box.style.background = isError ? 'var(--danger-soft)' : 'var(--ok-soft)';
    box.style.color = isError ? 'var(--danger)' : 'var(--ok)';
    box.textContent = text;
    box.classList.add('show');
  }

  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    form.classList.add('d-none');
    showMessage('This reset link is missing or invalid. Please request a new one from the Forgot Password page.', true);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    box.classList.remove('show');

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      showMessage('Passwords do not match.', true);
      return;
    }

    btn.disabled = true;
    try {
      await window.DAA_API.post('/auth/reset-password', { token, newPassword });
      form.classList.add('d-none');
      document.getElementById('successPanel').classList.remove('d-none');
    } catch (err) {
      showMessage(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
